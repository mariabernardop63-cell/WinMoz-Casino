<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 320px; height: 50px; overflow: hidden; background: transparent; }
#fallback {
  width: 320px; height: 50px;
  background: linear-gradient(90deg, #0d0d0d 0%, #1a0a2e 50%, #0d0d0d 100%);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid rgba(124,58,237,0.35); border-radius: 8px;
  font-family: 'Syne', -apple-system, sans-serif;
  text-decoration: none; cursor: pointer;
}
#fallback span.badge {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: #fff; font-size: 9px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 99px; text-transform: uppercase; flex-shrink: 0;
}
#fallback span.text {
  font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 600; letter-spacing: 0.2px;
}
#fallback span.dot {
  width: 5px; height: 5px; border-radius: 50%; background: #7c3aed;
  animation: pulse 1.8s ease-in-out infinite; flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
</style>
</head>
<body>
<a id="fallback" href="javascript:void(0)" onclick="return false;">
  <span class="dot"></span>
  <span class="badge">Anúncio</span>
  <span class="text">Ganhe a qualquer hora — Saques 24h</span>
</a>
<script>
(function() {
  var loaded = false;
  var timeout = setTimeout(function() {
    if (!loaded) { /* fallback remains visible */ }
  }, 3000);

  atOptions = {
    'key' : 'ee2e54a091a2ed3089fa43f7b0d711a0',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };

  var s = document.createElement('script');
  s.src = 'https://www.highperformanceformat.com/ee2e54a091a2ed3089fa43f7b0d711a0/invoke.js';
  s.onload = function() {
    loaded = true;
    clearTimeout(timeout);
    var fb = document.getElementById('fallback');
    if (fb) fb.style.display = 'none';
  };
  s.onerror = function() { clearTimeout(timeout); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
