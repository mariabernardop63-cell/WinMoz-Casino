<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Poker Winner</title>
    <meta name="description" content="Poker Winner — Plataforma de jogos e apostas em Moçambique." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Poker Winner" />
    <meta property="og:description" content="Poker Winner — Plataforma de jogos e apostas em Moçambique." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Poker Winner" />
    <meta name="twitter:description" content="Poker Winner — Plataforma de jogos e apostas em Moçambique." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/wood-texture.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/ludo-bg.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/ludo-board-nobg.png" as="image" />
    <link rel="preload" href="/damas-board.png" as="image" />
    <link rel="preload" href="/ludo-card.jpg" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #F8F9FA;
      }
      #root {
        min-height: 100vh;
        background: #F8F9FA;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        background: #F8F9FA;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-logo {
        display: flex;
        align-items: center;
        margin-bottom: 28px;
      }
      .loader-bar-wrap {
        width: 44px;
        height: 44px;
        margin-right: 10px;
        display: flex;
        align-items: center;
      }
      .loader-bar-a {
        width: 9px;
        height: 42px;
        background: #0D0D0D;
        border-radius: 3px;
        margin-right: 3px;
      }
      .loader-bar-b {
        width: 7px;
        height: 42px;
        background: rgba(13,13,13,0.18);
        border-radius: 3px;
      }
      .loader-text {
        display: flex;
        flex-direction: column;
      }
      .loader-title {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.5px;
        color: #0D0D0D;
        line-height: 1;
      }
      .loader-sub {
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 11px;
        letter-spacing: 3px;
        color: #0D0D0D;
        margin-top: 3px;
      }
      .loader-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(108, 92, 231, 0.15);
        border-top-color: #6C5CE7;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-logo">
        <div class="loader-bar-wrap">
          <div class="loader-bar-a"></div>
          <div class="loader-bar-b"></div>
        </div>
        <div class="loader-text">
          <span class="loader-title">POKER</span>
          <span class="loader-sub">WINNER ONLINE</span>
        </div>
      </div>
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var loader = document.getElementById('app-loader');
        var root = document.getElementById('root');
        if (!loader || !root) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 400);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: false });
        setTimeout(function() {
          loader.classList.add('hidden');
          setTimeout(function() { if (loader.parentNode) loader.remove(); }, 400);
        }, 8000);
      })();
    </script>
  </body>
</html>
