name: 🤖 Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:          # Permite disparar manualmente pelo GitHub

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java (required for Gradle/Android) ───────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. pnpm ─────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      # ── 4. Node.js ──────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # ── 5. Android SDK ──────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # ── 6. Install dependencies ─────────────────────────
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 7. Build web assets ──────────────────────────────
      - name: Build web assets
        working-directory: artifacts/winmoz
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 8. Capacitor — add android platform ─────────────
      - name: Add Android platform (if not cached)
        working-directory: artifacts/winmoz
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android project..."
            npx cap add android
          else
            echo "Android project already exists, skipping cap add."
          fi
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      # ── 9. Sync web assets into Android project ──────────
      - name: Capacitor sync
        working-directory: artifacts/winmoz
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      # ── 10. Apply security hardening ─────────────────────
      - name: Apply Android security patches
        working-directory: artifacts/winmoz
        run: |
          chmod +x ../../android-security/patch-android.sh
          ../../android-security/patch-android.sh android

      # ── 11. Decode keystore ──────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | \
            base64 --decode > \
            artifacts/winmoz/android/app/mozbet-release.keystore
          echo "Keystore decoded ✓"

      # ── 12. Gradle cache ─────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 13. Build signed release APK ─────────────────────
      - name: Build signed release APK
        working-directory: artifacts/winmoz/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/artifacts/winmoz/android/app/mozbet-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 14. Verify APK signature ─────────────────────────
      - name: Verify APK signature
        run: |
          APK="artifacts/winmoz/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK" ]; then
            echo "APK built successfully!"
            ls -lh "$APK"
            # Verify it is signed
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -10
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      # ── 15. Upload APK artifact ──────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MozBet-release-${{ github.run_number }}
          path: artifacts/winmoz/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      # ── 16. Summary ──────────────────────────────────────
      - name: Build summary
        run: |
          APK="artifacts/winmoz/android/app/build/outputs/apk/release/app-release.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## 🚀 MozBet APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | app-release.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamanho** | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Servidor** | ${{ secrets.VERCEL_PRODUCTION_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Signed, ProGuard-obfuscated, HTTPS-only" >> $GITHUB_STEP_SUMMARY
