name: 🤖 Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Confirm Node version
        run: node --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/winmoz
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform
        working-directory: artifacts/winmoz
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android project..."
            npx cap add android
          else
            echo "Android project already exists."
          fi
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      - name: Capacitor sync
        working-directory: artifacts/winmoz
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      - name: Apply security patches
        working-directory: artifacts/winmoz
        run: bash ../../android-security/patch-android.sh android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | \
            base64 --decode > artifacts/winmoz/android/app/mozbet-release.keystore
