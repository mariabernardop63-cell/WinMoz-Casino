name: 🤖 Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/winmoz
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform
        working-directory: artifacts/winmoz
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      - name: Capacitor sync
        working-directory: artifacts/winmoz
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

      - name: Apply security patches
        working-directory: artifacts/winmoz
        run: bash ../../android-security/patch-android.sh android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | \
            base64 --decode > artifacts/winmoz/android/app/mozbet-release.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build signed release APK
        working-directory: artifacts/winmoz/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/mozbet-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Find APK and prepare for upload
        run: |
          echo "=== All APK files found ==="
          find artifacts/winmoz/android -name "*.apk" 2>/dev/null || echo "None"
          echo "=========================="
          APK=$(find artifacts/winmoz/android/app/build -name "app-release.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find artifacts/winmoz/android/app/build -name "*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No signed APK found!"
            exit 1
          fi
          echo "✓ APK: $APK ($(du -sh $APK | cut -f1))"
          cp "$APK" mozbet-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MozBet-release-${{ github.run_number }}
          path: mozbet-release.apk
          retention-days: 90
          if-no-files-found: error
